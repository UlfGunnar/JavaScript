<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title> <!-- Nome na aba -->
    <style>
        body{
            background-color:rgb(226, 111, 17); /* cor de fundo */ 
            color:white; /* cor de todas as letras */
            font: normal 20pt Arial; /* formatação de texto*/
        }
        h1{
            color:rgb(0, 0, 0) /* cor especificamente das letras do titulo */ 
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1> <!-- Titulo -->
    <p>Já me livrei da maldição</p> <!-- Paragráfo -->
    <script>
        var nome = window.prompt('Qual é o seu nome?') //Pede para escrever algo
        window.alert("É um grande prazer te conhecer, "+ nome + "!")
    </script>
</body>
</html>
