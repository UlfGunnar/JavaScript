<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naturalidade</title>
    <style>
        body{
            background: gray;
        }
        div{
            background: whitesmoke;
            width: 180px;
            font: normal 20 pt Arial;
        }
    </style>
</head>
<body>
    <h1>Em qual país você nasceu?</h1>
    <input type="text" name="txtnat" id="txtnat">
    <input type="button" value="Verificar" onclick="clicar()">
    <input type="button" value="Limpar" onclick="limpar()">
    <div id="res">
    <script>
        var res = window.document.getElementById('res')
        function clicar() {
            var txtnat = window.document.getElementById('txtnat')
            var nat = (txtnat.value);
            res.innerHTML = `<p>Você nasceu em ${nat}</p>`
            if (nat.toUpperCase() == 'BRASIL') {
                res.innerHTML += `<p>Você é <strong>Brasileiro</strong></p>`
            } else {
                res.innerHTML += `<p>Você é <strong>Estrangeiro</strong></p>`
            }
        }
        function limpar() {
            res.innerHTML = ` ` 
        }
    </script>
</body>
</html>
